# Railway config for the FastAPI + ML API service.
# Deploy from repo root after: python scripts/package_models.py
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Keep the image ENTRYPOINT; only pass the role argument.
startCommand = "/entrypoint.sh api"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
