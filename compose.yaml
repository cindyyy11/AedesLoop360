services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aedes
      POSTGRES_USER: aedes_local
      POSTGRES_PASSWORD: ${AEDES_LOCAL_DB_PASSWORD:?Set a local-only database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aedes_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aedes_local -d aedes"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  aedes_pg:
