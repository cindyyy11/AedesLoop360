[project]
name = "aedesloop-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.3",
  "uvicorn==0.44.0",
  "SQLAlchemy==2.0.50",
  "alembic==1.18.4",
  "pydantic==2.11.7",
  "python-multipart==0.0.26",
  "Pillow==12.2.0",
  "psycopg[binary]==3.2.13",
  "httpx==0.28.1",
  "numpy==2.2.6",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python vercel_build.py"
